name: release

# Tag and forget: pushing `v0.3.0` builds every platform and publishes the
# release with the binaries attached. `workflow_dispatch` builds without
# publishing, which is how to check a change to this file before tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every target is built on a runner of its own architecture. RocksDB is
  # compiled from C++ source here, so cross-compiling it would mean carrying a
  # sysroot and a cross C++ toolchain per target; a native runner is both
  # simpler and what actually gets tested.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Cross-compiled from an arm64 runner: GitHub retired the Intel
          # macOS image, and a job asking for it simply queues for ever. The
          # SDK is universal and `cc` passes the target's -arch through, so
          # RocksDB's C++ cross-compiles here.
          - name: macos-amd64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: clang, for bindgen
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: libclang, for bindgen
        if: runner.os == 'macOS'
        run: |
          set -eu
          # Homebrew's libclang first: its install name is absolute, so a
          # build script that links it resolves at runtime. Xcode's is
          # referenced as @rpath/libclang.dylib, which dyld cannot find on its
          # own - hence DYLD_FALLBACK_LIBRARY_PATH as well as LIBCLANG_PATH.
          for p in "$(brew --prefix llvm 2>/dev/null || true)/lib" \
                   "$(xcode-select -p)/usr/lib" \
                   "$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"; do
            if [ -f "$p/libclang.dylib" ]; then
              echo "LIBCLANG_PATH=$p" >> "$GITHUB_ENV"
              echo "DYLD_FALLBACK_LIBRARY_PATH=$p" >> "$GITHUB_ENV"
              echo "found libclang in $p"
              exit 0
            fi
          done
          echo "no libclang.dylib found" >&2; exit 1
      - name: LLVM, for bindgen
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -d "/c/Program Files/LLVM/bin" ]; then
            echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"
          else
            choco install llvm -y --no-progress
            echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: cargo build --release --locked --bin schema-registry --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version="$(git rev-parse --short HEAD)"
          stem="schema-registry-${version}-${{ matrix.name }}"
          mkdir -p "dist/$stem"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/schema-registry.exe" "dist/$stem/"
          else
            cp "target/${{ matrix.target }}/release/schema-registry" "dist/$stem/"
            strip "dist/$stem/schema-registry" || true
          fi
          cp README.md CHANGELOG.md config.example.toml "dist/$stem/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$stem.zip" "$stem" >/dev/null
          else
            tar czf "$stem.tar.gz" "$stem"
          fi
          rm -rf "$stem"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # FreeBSD has no GitHub runner, so the build happens in a VM on one. Only
  # amd64: rustup ships no std for aarch64-unknown-freebsd (it is tier 3), so
  # that target needs `-Zbuild-std` and a cross-compiled RocksDB, or a
  # self-hosted FreeBSD/arm64 runner. See pending.md.
  build-freebsd:
    name: freebsd-amd64
    runs-on: ubuntu-latest
    # A toolchain problem on the platform without a runner must not hold up a
    # release for the six that have one. If this job fails the release goes out
    # without a FreeBSD binary, and the run says so.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          copyback: true
          prepare: pkg install -y rust llvm cmake gmake bash pkgconf
          run: |
            set -eu
            # Build the bundled RocksDB rather than looking for a system one:
            # librocksdb-sys probes pkg-config first, and on FreeBSD that left
            # the link line asking for a `-lrocksdb` that is not installed.
            export ROCKSDB_NO_PKG_CONFIG=1
            echo "--- rocksdb-related environment ---"
            env | grep -i -E "rocksdb|^CC=|^CXX=|^LIBCLANG" || echo "(none set)"
            # Build librocksdb-sys alone first, so its build script's decision
            # is legible instead of buried under 600 other crates.
            cargo build --release --locked -p librocksdb-sys -vv 2>&1 | grep -E "rustc-link|ROCKSDB|cargo:warning|error" | head -40 || true
            cargo build --release --locked --bin schema-registry

      - name: Package
        shell: bash
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version="$(git rev-parse --short HEAD)"
          stem="schema-registry-${version}-freebsd-amd64"
          mkdir -p "dist/$stem"
          cp target/release/schema-registry "dist/$stem/"
          cp README.md CHANGELOG.md config.example.toml "dist/$stem/"
          tar czf "dist/$stem.tar.gz" -C dist "$stem"
          rm -rf "dist/$stem"

      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-amd64
          path: dist/*
          if-no-files-found: error

  publish:
    # Only a tag publishes. A manual run is a build check and stops here.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-freebsd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Collect and checksum
        run: |
          set -eu
          mkdir -p dist
          find staging -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} dist/ \;
          cd dist
          # A platform whose build failed is simply absent; say which are here
          # so the release notes are not the only record of it.
          count=$(ls -1 | wc -l)
          [ "$count" -gt 0 ] || { echo "no artifacts at all - nothing to release" >&2; exit 1; }
          sha256sum * > SHA256SUMS
          echo "$count archives:"
          ls -l

      - name: Release notes from the changelog
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          # The section for this version, up to the next heading.
          awk -v v="## $version" '
            $0 == v {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md for what changed in $version." > notes.md
          fi
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            dist/*
