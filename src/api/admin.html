<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Schema Registry Console</title>
<style>
/* One file, no build step, no assets, no outside requests. The layout follows
   the rust-s3-server console so the two feel like one product; the accent is
   blue rather than crimson, which is the colour this corner of the world
   (Confluent, Kafka tooling) already speaks. */
:root {
  --nav:#07111f; --nav-hover:#111e2f; --nav-text:#9caabd; --nav-active:#fff;
  --bg:#f4f6f8; --surface:#fff; --surface-soft:#f8fafc; --line:#e2e7ec;
  --line-strong:#cdd5df; --text:#17212f; --muted:#647184; --subtle:#8d98a8;
  --accent:#0b6bcb; --accent-hover:#0956a8; --accent-soft:#eef5fe;
  --success:#16815a; --success-soft:#ebf8f2; --warning:#a8640b; --warning-soft:#fff7e7;
  --danger:#bd2939; --danger-soft:#fff0f1; --focus:0 0 0 3px rgba(11,107,203,.16);
  --shadow-sm:0 1px 2px rgba(15,23,42,.05); --shadow:0 10px 30px rgba(15,23,42,.12);
  --radius:8px; --sidebar:240px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
button, input, select, textarea { font:inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:none; box-shadow:var(--focus); }
.muted { color:var(--muted); }
.spacer { flex:1; }
.mono { font-family:var(--mono); }
.icon { width:18px; height:18px; flex:0 0 auto; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.icon.sm { width:15px; height:15px; }

/* Rail */
.sidebar { position:fixed; inset:0 auto 0 0; width:var(--sidebar); z-index:30; display:flex; flex-direction:column; background:var(--nav); color:var(--nav-text); transition:width .16s ease; }
.sidebar-brand { height:66px; display:flex; align-items:center; gap:11px; padding:0 16px 0 20px; color:#fff; border-bottom:1px solid rgba(255,255,255,.07); font-weight:700; font-size:17px; }
.brand-mark { width:31px; height:31px; border-radius:8px; display:grid; place-items:center; color:#fff; background:var(--accent); }
.sidebar-toggle { border:0; background:transparent; color:#8594a8; width:30px; height:30px; border-radius:6px; display:grid; place-items:center; cursor:pointer; }
.sidebar-toggle:hover { background:var(--nav-hover); color:#fff; }
.nav-label { margin:25px 20px 8px; color:#607086; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.13em; }
.nav-item { width:calc(100% - 20px); margin:2px 10px; height:42px; padding:0 12px; border:0; border-radius:6px; background:transparent; color:var(--nav-text); display:flex; align-items:center; gap:12px; cursor:pointer; text-align:left; transition:.14s ease; }
.nav-item:hover { color:#e9eef5; background:var(--nav-hover); }
.nav-item.active { color:var(--nav-active); background:#1b293a; box-shadow:inset 3px 0 var(--accent); }
.sidebar-foot { margin-top:auto; padding:14px 10px 16px; border-top:1px solid rgba(255,255,255,.07); }
.server-state { display:flex; align-items:flex-start; gap:9px; padding:10px 12px; color:#8594a8; font-size:12px; }
.state-dot { width:7px; height:7px; margin-top:5px; border-radius:50%; background:#3ac58d; box-shadow:0 0 0 3px rgba(58,197,141,.12); flex:none; }
.server-state.offline .state-dot { background:#d65a68; box-shadow:0 0 0 3px rgba(214,90,104,.12); }
.server-version { color:#607086; font-size:10px; font-family:var(--mono); }
body.collapsed { --sidebar:66px; }
body.collapsed .brand-name, body.collapsed .nav-text, body.collapsed .server-state-copy { display:none; }
body.collapsed .sidebar-brand { justify-content:center; padding:0; }
body.collapsed .sidebar-brand .brand-mark { display:none; }
body.collapsed .nav-item { width:44px; margin:2px auto; padding:0; justify-content:center; gap:0; }
body.collapsed .nav-label { text-align:center; margin:18px 0 6px; font-size:0; }

/* Shell */
.app-main { min-height:100vh; margin-left:var(--sidebar); transition:margin .16s ease; }
.topbar { position:sticky; top:0; z-index:20; height:66px; background:rgba(255,255,255,.96); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 28px; gap:14px; }
.page-heading h1 { margin:0; font-size:17px; letter-spacing:-.015em; }
.page-heading p { margin:1px 0 0; color:var(--muted); font-size:12px; }
.container-pill { display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 12px; border:1px solid var(--line-strong); border-radius:999px; background:#fff; font-size:12.5px; font-weight:600; }
.page { padding:22px 28px 60px; display:none; }
.page.active { display:block; }

/* Bits */
.btn { display:inline-flex; align-items:center; gap:7px; min-height:36px; padding:0 13px; border:1px solid var(--line-strong); border-radius:7px; background:#fff; color:var(--text); font-size:13px; font-weight:600; cursor:pointer; transition:.14s; }
.btn:hover { border-color:#aeb8c5; background:var(--surface-soft); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.primary:hover { background:var(--accent-hover); }
.btn.small { min-height:31px; padding:0 9px; font-size:12px; }
.btn.danger { color:var(--danger); border-color:#e7bcc1; }
.btn.danger:hover { background:var(--danger-soft); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.input, select.input { width:100%; height:38px; border:1px solid var(--line-strong); border-radius:7px; padding:0 11px; background:#fff; color:var(--text); }
.input:focus { border-color:var(--accent); box-shadow:var(--focus); outline:none; }
textarea.input { height:auto; min-height:150px; padding:11px; font-family:var(--mono); font-size:12.5px; line-height:1.5; resize:vertical; }
select.inline { height:30px; padding:0 8px; border:1px solid var(--line-strong); border-radius:6px; background:#fff; font-size:12.5px; }
.toolbar { display:flex; align-items:center; gap:10px; padding:11px 15px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.search { position:relative; width:min(340px,100%); flex:1 1 220px; }
.search .icon { position:absolute; left:11px; top:10px; color:var(--subtle); }
.search input { width:100%; height:36px; padding:0 12px 0 34px; border:1px solid var(--line-strong); border-radius:7px; }
.search input:focus { outline:none; border-color:var(--accent); box-shadow:var(--focus); }
label.check { display:inline-flex; align-items:center; gap:7px; color:var(--muted); font-size:12.5px; white-space:nowrap; }
label.check input { accent-color:var(--accent); }
.panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); overflow:hidden; margin-bottom:18px; }
.panel-title { padding:15px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
.panel-title h2 { margin:0; font-size:14px; }
.panel-title p { margin:3px 0 0; color:var(--muted); font-size:12px; }
.panel-body { padding:18px; }
.badge { display:inline-flex; align-items:center; padding:2px 8px; border-radius:99px; background:#edf1f5; color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; }
.badge.green { background:var(--success-soft); color:var(--success); }
.badge.amber { background:var(--warning-soft); color:var(--warning); }
.badge.red { background:var(--danger-soft); color:var(--danger); }
.table-wrap { overflow:auto; }
table { width:100%; border-collapse:collapse; }
th { height:40px; padding:0 15px; text-align:left; color:var(--muted); background:#fafbfc; border-bottom:1px solid var(--line); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; white-space:nowrap; cursor:pointer; user-select:none; }
th.plain { cursor:default; }
td { height:52px; padding:8px 15px; border-bottom:1px solid var(--line); vertical-align:middle; }
tbody tr:last-child td { border-bottom:0; }
tbody tr:hover td { background:#fbfcfd; }
td.num { text-align:right; font-variant-numeric:tabular-nums; }
td.actions { text-align:right; white-space:nowrap; }
a.link { color:var(--accent); font-family:var(--mono); cursor:pointer; text-decoration:none; word-break:break-all; }
a.link:hover { text-decoration:underline; }
.empty { padding:56px 25px; text-align:center; }
.empty-icon { width:48px; height:48px; margin:0 auto 14px; border-radius:12px; display:grid; place-items:center; background:#f1f4f7; color:#7e8a99; }
.empty h3 { margin:0 0 5px; font-size:14px; }
.empty p { max-width:420px; margin:0 auto; color:var(--muted); font-size:12.5px; }
.cards { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); margin-bottom:18px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:16px 18px; }
.card .k { color:var(--muted); font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
.card .v { margin-top:6px; font-size:26px; font-weight:650; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.card .s { margin-top:3px; color:var(--subtle); font-size:12px; }
.grid2 { display:grid; grid-template-columns:max-content 1fr; gap:10px 14px; align-items:center; }
.grid2 > span { color:var(--muted); font-size:13px; }
pre { margin:0; padding:12px 14px; background:var(--surface-soft); border:1px solid var(--line); border-radius:7px; overflow:auto; font-family:var(--mono); font-size:12.5px; white-space:pre-wrap; word-break:break-word; }
details.ver { border:1px solid var(--line); border-radius:7px; margin-bottom:10px; }
details.ver > summary { padding:10px 14px; cursor:pointer; display:flex; align-items:center; gap:9px; flex-wrap:wrap; font-size:13px; }
details.ver > summary:hover { background:var(--surface-soft); }
details.ver .body { padding:0 14px 12px; }

/* Dialogs and toasts */
dialog { border:1px solid var(--line); border-radius:12px; padding:0; background:var(--surface); color:var(--text); width:min(900px,94vw); box-shadow:var(--shadow); }
dialog::backdrop { background:rgba(15,23,42,.45); }
.dlg-head { display:flex; align-items:center; gap:12px; padding:15px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface); z-index:1; }
.dlg-head h2 { margin:0; font-size:15px; font-family:var(--mono); word-break:break-all; }
.dlg-body { padding:18px; max-height:70vh; overflow:auto; }
.dlg-foot { display:flex; gap:9px; justify-content:flex-end; padding:13px 18px; border-top:1px solid var(--line); background:var(--surface-soft); }
#toasts { position:fixed; right:20px; bottom:20px; z-index:60; display:flex; flex-direction:column; gap:9px; }
#toasts div { background:#fff; border:1px solid var(--line); border-left:3px solid var(--success); border-radius:8px; padding:11px 15px; box-shadow:var(--shadow); max-width:440px; font-size:13px; }
#toasts div.bad { border-left-color:var(--danger); }
.field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.field label { font-size:13px; font-weight:600; }
.field .hint { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-brand">
    <span class="brand-mark" data-icon="layers"></span>
    <span class="brand-name">Schemas</span>
    <span class="spacer"></span>
    <button class="sidebar-toggle" id="collapse" title="Collapse menu" aria-label="Toggle menu"><span data-icon="menu"></span></button>
  </div>
  <div class="nav-label">Registry</div>
  <button class="nav-item active" data-view="overview"><span data-icon="grid"></span><span class="nav-text">Overview</span></button>
  <button class="nav-item" data-view="subjects"><span data-icon="database"></span><span class="nav-text">Subjects</span></button>
  <button class="nav-item" data-view="contexts"><span data-icon="folder"></span><span class="nav-text">Contexts</span></button>
  <div class="nav-label">Replication</div>
  <button class="nav-item" data-view="exporters"><span data-icon="share"></span><span class="nav-text">Exporters</span></button>
  <div class="nav-label">Operations</div>
  <button class="nav-item" data-view="backup"><span data-icon="save"></span><span class="nav-text">Backup &amp; Restore</span></button>
  <button class="nav-item" data-view="cluster"><span data-icon="settings"></span><span class="nav-text">Settings</span></button>
  <div class="sidebar-foot">
    <div class="server-state" id="state">
      <span class="state-dot"></span>
      <span class="server-state-copy">
        <span id="state-text">Connected</span>
        <span class="server-version" id="state-version"></span>
      </span>
    </div>
  </div>
</aside>

<div class="app-main">
  <div class="topbar">
    <div class="page-heading">
      <h1 id="page-title">Overview</h1>
      <p id="page-sub">&nbsp;</p>
    </div>
    <span class="spacer"></span>
    <span class="container-pill"><span data-icon="box" class="icon sm"></span><span id="container-name">default</span></span>
    <button class="btn small" id="refresh"><span data-icon="refresh" class="icon sm"></span> Refresh</button>
  </div>

  <section class="page active" id="page-overview"></section>

  <section class="page" id="page-subjects">
    <div class="panel">
      <div class="toolbar">
        <div class="search"><span data-icon="search" class="icon"></span><input id="q" type="search" placeholder="Filter subjects" autocomplete="off"></div>
        <select class="inline" id="ctx-filter"><option value="">All contexts</option></select>
        <label class="check"><input type="checkbox" id="deleted"> Include soft-deleted</label>
        <span class="spacer"></span>
        <span class="muted" id="count" style="font-size:12.5px"></span>
        <button class="btn primary small" id="new-schema"><span data-icon="plus" class="icon sm"></span> Register schema</button>
      </div>
      <div id="subjects"></div>
    </div>
  </section>

  <section class="page" id="page-contexts"></section>
  <section class="page" id="page-exporters"></section>
  <section class="page" id="page-backup"></section>
  <section class="page" id="page-cluster"></section>
</div>

<dialog id="modal">
  <div class="dlg-head"><h2 id="m-title"></h2><span class="spacer"></span><button class="btn small" id="m-close">Close</button></div>
  <div class="dlg-body" id="m-body"></div>
  <div class="dlg-foot" id="m-foot" hidden></div>
</dialog>
<div id="toasts"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const enc = encodeURIComponent;
const SR = "application/vnd.schemaregistry.v1+json";
const LEVELS = ["BACKWARD","BACKWARD_TRANSITIVE","FORWARD","FORWARD_TRANSITIVE","FULL","FULL_TRANSITIVE","NONE"];
const MODES = ["READWRITE","READONLY","IMPORT"];
const PAGES = {
  overview:  ["Overview", "What this container holds"],
  subjects:  ["Subjects", "Every subject, its versions and the settings that apply"],
  contexts:  ["Contexts", "A context is its own namespace: ids, settings and all"],
  exporters: ["Exporters", "Schema linking: what is copied where, and how it is going"],
  backup:    ["Backup & Restore", "A logical dump that restores into another build - or into Confluent"],
  cluster:   ["Settings", "Registry-wide compatibility and mode"],
};

// Inline icons: no sprite sheet, no requests.
const ICONS = {
  layers: "m12 3 9 5-9 5-9-5 9-5M3 13l9 5 9-5M3 17l9 5 9-5",
  menu: "M4 6h16M4 12h16M4 18h16",
  grid: "M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z",
  database: "M12 4c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3M4 7v10c0 1.7 3.6 3 8 3s8-1.3 8-3V7M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3",
  folder: "M4 7a2 2 0 0 1 2-2h3.5l2 2H18a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z",
  share: "M8 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0M22 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0M22 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0M7.6 10.6 16.4 7M7.6 13.4l8.8 3.6",
  save: "M5 4h11l3 3v13H5zM8 4v6h7V4M8 20v-6h8v6",
  settings: "M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3H9.8l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4.4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2",
  refresh: "M20 11A8 8 0 0 0 6.3 6.3L4 8.5M4 13a8 8 0 0 0 13.7 4.7L20 15.5M4 4v4.5h4.5M20 20v-4.5h-4.5",
  search: "M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16M21 21l-4.3-4.3",
  plus: "M12 5v14M5 12h14",
  box: "m12 3 8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12 4 7.5",
  trash: "M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13M10 11v6M14 11v6",
  pause: "M9 5v14M15 5v14",
  play: "m7 5 12 7-12 7z",
  rotate: "M4 9a8 8 0 0 1 13.3-3L20 8.5M20 15a8 8 0 0 1-13.3 3L4 15.5M20 4v4.5h-4.5M4 20v-4.5h4.5",
  download: "M12 4v11M8 11l4 4 4-4M4 19h16",
  upload: "M12 19V8M8 12l4-4 4 4M4 20h16",
  alert: "M12 8v5M12 17h.01M10.3 4 3 17a2 2 0 0 0 1.7 3h14.6a2 2 0 0 0 1.7-3L13.7 4a2 2 0 0 0-3.4 0",
  clock: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M12 7v5l3 2",
};
function paintIcons(root = document) {
  for (const el of root.querySelectorAll("[data-icon]")) {
    const d = ICONS[el.dataset.icon];
    if (!d) continue;
    el.innerHTML = `<svg class="icon${el.classList.contains("icon") ? "" : ""}" viewBox="0 0 24 24"><path d="${d}"/></svg>`;
    el.replaceWith(...el.childNodes);
  }
}

let data = null;
let view = { page: "overview", sort: "subject", dir: 1 };

async function api(path, opts = {}) {
  const init = { method: opts.method || "GET", headers: { accept: SR } };
  if (opts.body !== undefined) {
    init.headers["content-type"] = opts.raw ? "application/x-ndjson" : SR;
    init.body = opts.raw ? opts.body : JSON.stringify(opts.body);
  }
  const r = await fetch(path, init);
  const text = await r.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { body = text; }
  if (!r.ok) throw new Error(body?.message || `HTTP ${r.status}${text ? ": " + String(text).slice(0, 200) : ""}`);
  return body;
}

function say(msg, bad) {
  const el = document.createElement("div");
  el.textContent = msg;
  if (bad) el.className = "bad";
  $("toasts").append(el);
  setTimeout(() => el.remove(), bad ? 9000 : 3800);
}

async function act(what, fn) {
  try {
    await fn();
    say(what);
    await load();
    return true;
  } catch (e) {
    say(`${what}: ${e.message}`, true);
    return false;
  }
}

function modal(title, html, footer) {
  $("m-title").textContent = title;
  $("m-body").innerHTML = html;
  $("m-foot").innerHTML = footer || "";
  $("m-foot").hidden = !footer;
  paintIcons($("m-body"));
  if (!$("modal").open) $("modal").showModal();
}

/// An in-page confirmation; window.confirm would freeze the page.
function confirmAction(title, html, label, danger = true) {
  return new Promise((resolve) => {
    modal(title, html, `<button class="btn" id="c-no">Cancel</button><button class="btn ${danger ? "danger" : "primary"}" id="c-yes">${esc(label)}</button>`);
    $("c-no").onclick = () => { $("modal").close(); resolve(false); };
    $("c-yes").onclick = () => { $("modal").close(); resolve(true); };
  });
}

const levelSelect = (current, key) =>
  `<select class="inline" data-do="${key}">${LEVELS.map((l) => `<option${l === current ? " selected" : ""}>${l}</option>`).join("")}</select>`;
const modeSelect = (current, key, extra = []) =>
  `<select class="inline" data-do="${key}">${[...MODES, ...extra].map((m) => `<option${m === current ? " selected" : ""}>${m}</option>`).join("")}</select>`;
const empty = (icon, title, body) =>
  `<div class="empty"><div class="empty-icon"><span data-icon="${icon}"></span></div><h3>${esc(title)}</h3><p>${body}</p></div>`;

/// A mode change the registry refuses is offered with force, never forced.
async function putMode(path, mode, what) {
  const url = path ? `/mode/${path}` : "/mode";
  try {
    await api(url, { method: "PUT", body: { mode } });
    say(`${what}: mode ${mode}`);
    await load();
  } catch (e) {
    const ok = await confirmAction("Mode change refused",
      `<p>${esc(e.message)}</p><p class="muted">Retry with <code>force=true</code>? That skips the checks the registry makes around IMPORT mode, and can leave ids and versions inconsistent.</p>`,
      "Force it");
    if (!ok) return;
    await act(`${what}: mode ${mode} (forced)`, () => api(`${url}?force=true`, { method: "PUT", body: { mode } }));
  }
}

// ---------------- overview ----------------

function renderOverview() {
  const exp = data.exporters;
  const bad = exp.filter((e) => e.state === "FAILED" || e.state === "ERROR").length;
  const paused = exp.filter((e) => e.state === "PAUSED").length;
  $("page-overview").innerHTML = `
    <div class="cards">

const STATE_CLASS = { RUNNING: "green", STARTING: "", PAUSED: "amber", ERROR: "red", FAILED: "red" };
const stateBadge = (e) =>
  `<span class="badge ${STATE_CLASS[e.state] ?? ""}">${esc(e.state)}</span>` +
  (e.trace ? ` <span class="badge red" title="${esc(e.trace)}">why</span>` : "");

// ---------------- subjects ----------------

function renderSubjects() {
  const q = $("q").value.trim().toLowerCase();
  const ctx = $("ctx-filter").value;
  const rows = data.subjects
    .filter((r) => (!q || r.subject.toLowerCase().includes(q)) && (!ctx || r.context === ctx))
    .sort((a, b) => {
      const av = a[view.sort] ?? "", bv = b[view.sort] ?? "";
      return (typeof av === "number" ? av - bv : String(av).localeCompare(String(bv))) * view.dir;
    });
  $("count").textContent = `${rows.length} of ${data.counts.subjects}`;
  if (!rows.length) {
    $("subjects").innerHTML = empty("database", "No subjects match",
      data.counts.subjects ? "Try a different filter, or include soft-deleted ones." : "Register one to get started.");
    paintIcons($("subjects"));
    return;
  }
  const head = [["subject","Subject"],["versions","Versions"],["latestVersion","Latest"],["latestId","Id"],
                ["schemaType","Type"],["compatibility","Compatibility"],["mode","Mode"]];
  $("subjects").innerHTML = `<div class="table-wrap"><table><thead><tr>${
    head.map(([k, l]) => `<th data-k="${k}">${l}${view.sort === k ? (view.dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("")
  }<th class="plain"></th></tr></thead><tbody>${rows.map((r) => `<tr>
    <td><a class="link" data-subject="${esc(r.subject)}">${esc(r.subject)}</a>
      ${r.alias ? ` <span class="badge">alias → ${esc(r.alias)}</span>` : ""}
      ${r.deleted ? ' <span class="badge red">soft-deleted</span>' : ""}</td>
    <td class="num">${r.versions}${r.deletedVersions ? ` <span class="badge amber">${r.deletedVersions} del</span>` : ""}</td>
    <td class="num">${r.latestVersion ?? "—"}</td>
    <td class="num">${r.latestId ?? "—"}</td>
    <td>${esc(r.schemaType ?? "—")}</td>
    <td>${levelSelect(r.compatibility, `s-compat:${esc(r.subject)}`)} <span class="badge">${esc(r.compatibilityFrom)}</span></td>
    <td>${modeSelect(r.mode, `s-mode:${esc(r.subject)}`)}</td>
    <td class="actions">
      <button class="btn small" data-subject="${esc(r.subject)}">Detail</button>
      <button class="btn small danger" data-delete="${esc(r.subject)}">${r.deleted ? "Delete permanently" : "Delete"}</button>
    </td>
  </tr>`).join("")}</tbody></table></div>`;

  $("subjects").querySelectorAll("th[data-k]").forEach((th) => th.onclick = () => {
    view.dir = view.sort === th.dataset.k ? -view.dir : 1;
    view.sort = th.dataset.k;
    renderSubjects();
  });
  $("subjects").querySelectorAll("[data-subject]").forEach((el) => el.onclick = () => showSubject(el.dataset.subject));
  $("subjects").querySelectorAll("[data-delete]").forEach((el) => el.onclick = () => deleteSubject(el.dataset.delete));
  $("subjects").querySelectorAll("select[data-do]").forEach((sel) => sel.onchange = () => {
    const key = sel.dataset.do, subject = key.slice(key.indexOf(":") + 1);
    if (key.startsWith("s-compat")) {
      act(`${subject}: compatibility ${sel.value}`, () => api(`/config/${enc(subject)}`, { method: "PUT", body: { compatibility: sel.value } }));
    } else {
      putMode(enc(subject), sel.value, subject);
    }
  });
}

async function deleteSubject(subject) {
  const row = data.subjects.find((r) => r.subject === subject) || {};
  const gone = !!row.deleted;
  const ok = await confirmAction(`Delete ${subject}`,
    `<p>${gone
      ? "This subject is already soft-deleted. A permanent delete removes every version and its ids; clients holding those ids will fail."
      : "A soft delete hides the subject but keeps its schemas, so re-registering brings it back. A permanent delete cannot be undone."}</p>
     <label class="check"><input type="checkbox" id="perm"${gone ? " checked" : ""}> Permanent</label>`, "Delete");
  if (!ok) return;
  const perm = $("perm")?.checked;
  await act(`deleted ${subject}${perm ? " permanently" : ""}`, async () => {
    if (perm && !gone) await api(`/subjects/${enc(subject)}`, { method: "DELETE" });
    await api(`/subjects/${enc(subject)}${perm ? "?permanent=true" : ""}`, { method: "DELETE" });
  });
}

async function showSubject(subject) {
  modal(subject, '<p class="muted">Loading…</p>');
  let d;
  try {
    d = await api(`/admin/api/subjects/${enc(subject)}`);
  } catch (e) {
    return modal(subject, `<p class="badge red">${esc(e.message)}</p>`);
  }
  const row = data.subjects.find((r) => r.subject === subject) || {};
  modal(subject, `
    <div class="grid2" style="margin-bottom:16px">
      <span>Compatibility</span><div>${levelSelect(d.effectiveCompatibility, "d-compat")}
        ${d.config ? '<button class="btn small" id="d-unset">Clear subject config</button>' : '<span class="badge">inherited</span>'}</div>
      <span>Mode</span><div>${modeSelect(d.mode, "d-mode")}
        ${row.modeFrom === "subject" ? '<button class="btn small" id="d-unmode">Clear subject mode</button>' : '<span class="badge">inherited</span>'}</div>
      <span>Subject config</span><div class="mono muted">${d.config ? esc(JSON.stringify(d.config)) : "none"}</div>
    </div>
    <button class="btn primary small" id="d-newver"><span data-icon="plus" class="icon sm"></span> Register new version</button>
    <div style="height:14px"></div>
    ${d.versions.slice().reverse().map((v) => `
      <details class="ver"${v.version === row.latestVersion ? " open" : ""}>
        <summary><strong>v${v.version}</strong>
          <span class="badge">id ${v.id}</span><span class="badge">${esc(v.schemaType)}</span>
          ${v.deleted ? '<span class="badge amber">soft-deleted</span>' : ""}
          ${v.references.length ? `<span class="badge">${v.references.length} refs</span>` : ""}
          ${v.referencedBy.length ? `<span class="badge red">referenced by v${v.referencedBy.join(", v")}</span>` : ""}
          ${v.metadata ? '<span class="badge">metadata</span>' : ""}${v.ruleSet ? '<span class="badge">ruleSet</span>' : ""}
          <span class="spacer"></span>
          <button class="btn small danger" data-delv="${v.version}" data-perm="${v.deleted}">${v.deleted ? "Delete permanently" : "Delete version"}</button>
        </summary>
        <div class="body">
          <pre>${esc(pretty(v.schema, v.schemaType))}</pre>
          ${v.references.length ? `<div style="height:8px"></div><pre>references: ${esc(JSON.stringify(v.references, null, 2))}</pre>` : ""}
          ${v.metadata ? `<div style="height:8px"></div><pre>metadata: ${esc(JSON.stringify(v.metadata, null, 2))}</pre>` : ""}
          ${v.ruleSet ? `<div style="height:8px"></div><pre>ruleSet: ${esc(JSON.stringify(v.ruleSet, null, 2))}</pre>` : ""}
        </div>
      </details>`).join("")}`);

  $("m-body").querySelector('[data-do="d-compat"]').onchange = (e) =>
    act(`${subject}: compatibility ${e.target.value}`,
        () => api(`/config/${enc(subject)}`, { method: "PUT", body: { compatibility: e.target.value } })).then(() => showSubject(subject));
  $("m-body").querySelector('[data-do="d-mode"]').onchange = (e) =>
    putMode(enc(subject), e.target.value, subject).then(() => showSubject(subject));
  if ($("d-unset")) $("d-unset").onclick = () =>
    act(`${subject}: config cleared`, () => api(`/config/${enc(subject)}`, { method: "DELETE" })).then(() => showSubject(subject));
  if ($("d-unmode")) $("d-unmode").onclick = () =>
    act(`${subject}: mode cleared`, () => api(`/mode/${enc(subject)}`, { method: "DELETE" })).then(() => showSubject(subject));
  $("d-newver").onclick = () => {
    const latest = d.versions[d.versions.length - 1];
    registerModal({ subject, schemaType: latest.schemaType, schema: pretty(latest.schema, latest.schemaType), references: latest.references });
  };
  $("m-body").querySelectorAll("[data-delv]").forEach((b) => b.onclick = async (e) => {
    e.preventDefault();
    const v = b.dataset.delv, perm = b.dataset.perm === "true";
    const ok = await confirmAction(`Delete ${subject} v${v}`,
      perm ? "<p>This version is soft-deleted. Removing it permanently frees its id and cannot be undone.</p>"
           : "<p>A soft delete hides the version; re-registering the same schema brings it back.</p>", "Delete");
    if (!ok) return showSubject(subject);
    await act(`deleted ${subject} v${v}${perm ? " permanently" : ""}`,
              () => api(`/subjects/${enc(subject)}/versions/${v}${perm ? "?permanent=true" : ""}`, { method: "DELETE" }));
    showSubject(subject);
  });
}

function pretty(schema, type) {
  if (type === "PROTOBUF") return schema;
  try { return JSON.stringify(JSON.parse(schema), null, 2); } catch { return schema; }
}

/// Register a schema, the way any client would - with the compatibility check
/// one button away, and a refusal that keeps the form and says why.
function registerModal(seed = {}) {
  const types = ["AVRO", "JSON", "PROTOBUF"];
  const refs = seed.references?.length ? JSON.stringify(seed.references, null, 2) : "";
  modal(seed.subject ? `New version of ${seed.subject}` : "Register schema", `
    <div class="field"><label>Subject</label>
      <input class="input" id="r-subject" value="${esc(seed.subject ?? "")}" ${seed.subject ? "readonly" : ""}
             placeholder="orders-value, or :.eu:orders-value" autocomplete="off"></div>
    <div class="field"><label>Type</label>
      <select class="input" id="r-type">${types.map((t) => `<option${t === (seed.schemaType ?? "AVRO") ? " selected" : ""}>${t}</option>`).join("")}</select></div>
    <div class="field"><label>Schema</label>
      <textarea class="input" id="r-schema" rows="14" spellcheck="false" placeholder='{"type":"record","name":"User","fields":[]}'>${esc(seed.schema ?? "")}</textarea></div>
    <details class="ver"><summary>References${refs ? " (carried over)" : ""}</summary>
      <div class="body"><textarea class="input" id="r-refs" rows="5" spellcheck="false"
        placeholder='[{"name": "com.x.Dep", "subject": "dep", "version": 1}]'>${esc(refs)}</textarea></div></details>
    <div id="r-result"></div>`,
    `<button class="btn" id="r-check">Check compatibility</button><button class="btn" id="r-cancel">Cancel</button><button class="btn primary" id="r-go">Register</button>`);

  const body = () => {
    const subject = $("r-subject").value.trim();
    if (!subject) throw new Error("subject is required");
    const schema = $("r-schema").value.trim();
    if (!schema) throw new Error("schema is required");
    const out = { schema, schemaType: $("r-type").value };
    const refs = $("r-refs").value.trim();
    if (refs) {
      out.references = JSON.parse(refs);
      if (!Array.isArray(out.references)) throw new Error("references must be a JSON array");
    }
    return [subject, out];
  };
  const show = (html, bad) => $("r-result").innerHTML = `<p class="${bad ? "badge red" : "badge green"}" style="white-space:normal;text-transform:none;font-size:12.5px;padding:8px 10px">${html}</p>`;

  $("r-cancel").onclick = () => $("modal").close();
  $("r-check").onclick = async () => {
    try {
      const [subject, b] = body();
      const v = await api(`/compatibility/subjects/${enc(subject)}/versions?verbose=true`, { method: "POST", body: b });
      show(v.is_compatible ? "Compatible with every version this subject's level covers"
                           : `Not compatible: ${esc((v.messages || []).join(" "))}`, !v.is_compatible);
    } catch (e) { show(esc(e.message), true); }
  };
  $("r-go").onclick = async () => {
    let subject, b;
    try { [subject, b] = body(); } catch (e) { return show(esc(e.message), true); }
    try {
      const r = await api(`/subjects/${enc(subject)}/versions`, { method: "POST", body: b });
      say(`${subject}: registered id ${r.id}`);
      $("modal").close();
      await load();
      showSubject(subject);
    } catch (e) {
      show(esc(e.message), true);  // keep the form: the reason is the point
    }
  };
}

function newExporter() {
  modal("New exporter", `

    <div class="field"><label>Context type</label>
      <select class="input" id="e-ctxtype"><option>AUTO</option><option>CUSTOM</option><option>NONE</option><option>DEFAULT</option></select></div>
    <div class="field"><label>Context</label><input class="input" id="e-ctx" placeholder="only for CUSTOM, e.g. .from-prod"></div>
    <div class="field"><label>Rename format</label><input class="input" id="e-rename" placeholder="optional, e.g. \${subject}-copy"></div>

  "schema.registry.url": "http://localhost:8081"
}</textarea><span class="hint">Add <code>basic.auth.user.info</code> if the destination needs credentials.</span></div>`,

  $("e-cancel").onclick = () => $("modal").close();
  $("e-create").onclick = async () => {
    let config;
    try { config = JSON.parse($("e-config").value); } catch (err) { return say(`config: ${err.message}`, true); }
    const body = {
      name: $("e-name").value.trim(),
      subjects: $("e-subjects").value.split(",").map((s) => s.trim()).filter(Boolean),
      contextType: $("e-ctxtype").value,
      config,
    };
    if ($("e-ctx").value.trim()) body.context = $("e-ctx").value.trim();
    if ($("e-rename").value.trim()) body.subjectRenameFormat = $("e-rename").value.trim();
    if (await act(`created exporter ${body.name}`, () => api("/exporters", { method: "POST", body }))) $("modal").close();
  };
}

// ---------------- backup & restore ----------------

function renderBackup() {
  $("page-backup").innerHTML = `
    <div class="panel">
      <div class="panel-title"><div><h2>Backup</h2><p>A logical dump - subjects, versions, ids, references, metadata, rule sets, config, modes and exporters - as newline-delimited JSON. Nothing about the on-disk format, so it restores into another build, and into Confluent.</p></div></div>
      <div class="panel-body">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button class="btn primary" id="b-download"><span data-icon="download" class="icon sm"></span> Download dump</button>
          <span class="muted" style="font-size:12.5px">${data.counts.subjects} subjects, ${data.counts.versions} versions, ${data.exporters.length} exporters</span>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title"><div><h2>Restore</h2><p>Replays a dump into <strong>this</strong> container, keeping ids and version numbers. Re-running is safe: registering the same id and version again is a no-op.</p></div></div>
      <div class="panel-body">
        <div class="field"><label>Dump file</label><input type="file" id="b-file" accept=".ndjson,.json,.txt,application/x-ndjson">
          <span class="hint">Or paste the contents below.</span></div>
        <div class="field"><label>Dump</label><textarea class="input" id="b-text" rows="10" spellcheck="false" placeholder='{"type":"schema","subject":"orders-value",…}'></textarea></div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button class="btn" id="b-dry"><span data-icon="clock" class="icon sm"></span> Dry run</button>
          <button class="btn primary" id="b-restore"><span data-icon="upload" class="icon sm"></span> Restore</button>
          <span class="muted" id="b-result" style="font-size:12.5px"></span>
        </div>
      </div>
    </div>`;
  paintIcons($("page-backup"));

  $("b-download").onclick = () => {
    // Let the browser do the download, with the server's filename.
    window.location.href = "/admin/api/backup";
    say("downloading dump");
  };
  $("b-file").onchange = async () => {
    const f = $("b-file").files[0];
    if (!f) return;
    $("b-text").value = await f.text();
    $("b-result").textContent = `${f.name}: ${f.size.toLocaleString()} bytes loaded`;
  };
  const run = async (dryRun) => {
    const text = $("b-text").value.trim();
    if (!text) return say("nothing to restore: choose a file or paste a dump", true);
    if (!dryRun) {
      const ok = await confirmAction("Restore into this container",
        `<p>This writes every subject and version in the dump into <strong>${esc(data.container)}</strong>, keeping their ids. Existing subjects with the same names are written over.</p>
         <p class="muted">A dry run first will tell you how much it covers.</p>`, "Restore", true);
      if (!ok) return;
    }
    try {
      const r = await api(`/admin/api/restore?dryRun=${dryRun}`, { method: "POST", body: text, raw: true });
      const msg = `${dryRun ? "would restore" : "restored"} ${r.subjects} subjects, ${r.versions} versions (${r.softDeleted} soft-deleted), ${r.configs} configs, ${r.modes} modes, ${r.exporters} exporters`;
      $("b-result").textContent = msg;
      say(msg);
      if (!dryRun) await load();
    } catch (e) {
      $("b-result").textContent = e.message;
      say(`restore: ${e.message}`, true);
    }
  };
  $("b-dry").onclick = () => run(true);
  $("b-restore").onclick = () => run(false);
}

// ---------------- settings ----------------

function renderCluster() {
  const g = data.global;
  $("page-cluster").innerHTML = `<div class="panel">
    <div class="panel-title"><div><h2>Registry-wide settings</h2><p>These apply to the default context. Every other context carries its own, on the Contexts page.</p></div></div>
    <div class="panel-body">
      <div class="grid2" style="max-width:620px">
        <span>Host container</span><div><code class="mono">${esc(data.container)}</code></div>
        <span>Cluster id</span><div><code class="mono">${esc(data.clusterId)}</code></div>
        <span>Server version</span><div>${esc(data.version)}</div>
        <span>Global compatibility</span><div>${levelSelect(g.compatibility, "g-compat")}</div>
        <span>Global mode</span><div>${modeSelect(g.mode, "g-mode", ["READONLY_OVERRIDE"])}</div>
        <span>Normalize by default</span><div>${g.normalize ? "yes" : "no"}</div>
      </div>
      <p class="muted" style="margin-top:16px;font-size:12.5px">READONLY_OVERRIDE makes the whole registry read-only, contexts and subject modes included - it is the one setting that reaches into every context.</p>
    </div>
  </div>`;
  $("page-cluster").querySelector('[data-do="g-compat"]').onchange = (e) =>
    act(`global compatibility ${e.target.value}`, () => api("/config", { method: "PUT", body: { compatibility: e.target.value } }));
  $("page-cluster").querySelector('[data-do="g-mode"]').onchange = (e) => putMode("", e.target.value, "global");
}

// ---------------- shell ----------------

function show(page) {
  view.page = page;
  document.querySelectorAll(".nav-item").forEach((b) => b.classList.toggle("active", b.dataset.view === page));
  document.querySelectorAll(".page").forEach((s) => s.classList.toggle("active", s.id === `page-${page}`));
  const [title, sub] = PAGES[page];
  $("page-title").textContent = title;
  $("page-sub").textContent = sub;
  location.hash = page;
}

function renderAll() {
  $("container-name").textContent = data.container;
  $("state-version").textContent = `v${data.version}`;
  const sel = $("ctx-filter"), keep = sel.value;
  sel.innerHTML = '<option value="">All contexts</option>' + data.contexts.map((c) => `<option>${esc(c.name)}</option>`).join("");
  sel.value = keep;
  renderOverview();
  renderSubjects();
  renderContexts();
  renderExporters();
  renderBackup();
  renderCluster();
}

async function load() {
  try {
    data = await api(`/admin/api/overview?deleted=${$("deleted").checked}`);
    $("state").classList.remove("offline");
    $("state-text").textContent = "Connected";
    renderAll();
  } catch (e) {
    $("state").classList.add("offline");
    $("state-text").textContent = "Unreachable";
    say(e.message, true);
  }
}

document.querySelectorAll(".nav-item").forEach((b) => b.onclick = () => show(b.dataset.view));
$("collapse").onclick = () => document.body.classList.toggle("collapsed");
$("refresh").onclick = load;
$("q").oninput = () => renderSubjects();
$("ctx-filter").onchange = () => renderSubjects();
$("deleted").onchange = load;
$("new-schema").onclick = () => registerModal();
$("m-close").onclick = () => $("modal").close();
paintIcons();
show(PAGES[location.hash.slice(1)] ? location.hash.slice(1) : "overview");
load();
</script>
</body>
</html>
