# rust-schema-registry configuration. Every key is optional.

listen = "0.0.0.0:8081"
data_dir = "./data"

# Used when no global/context/subject compatibility is configured.
default_compatibility = "BACKWARD"

# Reported by /v1/metadata/id and used as the AUTO exporter context name.
# Generated (and persisted) on first start when unset.
# cluster_id = "sr-prod-1"

# Normalize schemas so logically equal spellings share an id (Confluent's default is false).
normalize = true

# fsync the WAL on every write. Off = faster writes, may lose the last few on power loss.
sync_writes = true

# Max entries per in-memory schema cache (bodies, parsed stored schemas, parsed
# request schemas). All ids/subjects/versions/config are always in memory.
cache_max_entries = 20000

max_body_bytes = 16777216
exporter_poll_seconds = 10

[auth]
enabled = false
realm = "SchemaRegistry"

# Roles apply to the whole registry:
#
# [[auth.users]]
# username = "admin"
# password = "$2b$12$..."        # schema-registry hash-password '...'
# roles = ["admin"]
#
# [[auth.users]]
# username = "ci"
# password = "$2b$12$..."
# roles = ["write"]
#
# [[auth.users]]
# username = "app"
# password = "$2b$12$..."
# roles = ["readonly"]

# ...and a role can also be bound to subjects. Bindings add to `roles`, one
# entry per role, and a pattern is `context::subject` with `*` as a wildcard:
#
#   .::orders-value   that subject in the default context
#   .::test*          every subject starting with "test" in the default context
#   .eu::*            everything in the .eu context, and that context's own
#                     compatibility and mode
#   *::*              everywhere (the same as a registry-wide role)
#
# A pattern without `::` is read as a subject in the default context.
# Listings (/subjects, /schemas, /contexts and the /_admin UI) are filtered to
# what the caller may see, so a scoped user sees their own subjects and nothing
# else. Global config and mode, contexts and exporters stay with `roles`.
#
# [[auth.users]]
# username = "team-a"
# password = "$2b$12$..."
# roles = ["readonly"]           # reads everything...
# [[auth.users.bindings]]
# role = "admin"                 # ...and owns its own subjects
# subjects = [".::abc*", ".::def*"]
# [[auth.users.bindings]]
# role = "write"
# subjects = [".::xyz-*"]
#
# [[auth.users]]
# username = "eu-team"
# password = "$2b$12$..."
# roles = []                     # nothing registry-wide: only what it is bound to
# [[auth.users.bindings]]
# role = "admin"
# subjects = [".eu::*"]
